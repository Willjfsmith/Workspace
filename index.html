<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Lead workspace</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lead workspace">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#FFFFFF; --sheet:#FFFFFF; --rail:#F6F6F6; --ink:#111111; --muted:#6B6B6B; --line:#BDBDBD; --rule:#E3E3E3; --accent:#111111; --hit:#F2F2F2; --red:#B3261E; --bar:#D9D9D9; --amber:#111111; --ok:#111111;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --head:"Barlow Condensed","Arial Narrow",system-ui,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--board:#0E0E0E; --sheet:#131313; --rail:#090909; --ink:#EDEDED; --muted:#9B9B9B; --line:#4D4D4D; --rule:#2A2A2A; --accent:#EDEDED; --hit:#1F1F1F; --red:#FF8A80; --bar:#3A3A3A; --amber:#EDEDED; --ok:#EDEDED}
}
:root[data-theme="dark"]{--board:#0E0E0E; --sheet:#131313; --rail:#090909; --ink:#EDEDED; --muted:#9B9B9B; --line:#4D4D4D; --rule:#2A2A2A; --accent:#EDEDED; --hit:#1F1F1F; --red:#FF8A80; --bar:#3A3A3A; --amber:#EDEDED; --ok:#EDEDED}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--board); color:var(--ink); font:400 .906rem/1.4 var(--body); display:grid; grid-template-columns:220px minmax(0,1fr)}
h1,h2{font-family:var(--head); font-weight:600; margin:0; line-height:1.1}
h1{font-size:1.9rem}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

#rail{border-right:1px solid var(--rule); padding:14px 10px; position:sticky; top:0; align-self:start; min-height:100vh; max-height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:1px}
#rail .brand{font:600 1.15rem var(--head); padding:0 8px 8px}
#rail .sec{font-size:.78rem; color:var(--muted); padding:12px 8px 3px}
#rail button{all:unset; cursor:pointer; padding:5px 8px; border-radius:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; gap:6px; align-items:baseline}
#rail button:hover{background:var(--sheet)}
#rail button:focus-visible{outline:2px solid var(--accent)}
#rail button[aria-current="page"]{background:var(--ink); color:var(--board); font-weight:500}
#rail button.new{color:var(--accent)}
#rail .n{margin-left:auto; opacity:.7; font-variant-numeric:tabular-nums}
#rail input{border:1px solid var(--rule); background:var(--sheet); border-radius:3px; padding:5px 8px; margin:0 0 6px; min-width:0}
.mk{font-size:.7rem} .mk.ok{color:var(--ok)} .mk.watch{color:var(--amber)} .mk.behind{color:var(--red)}
#status{margin-top:auto; padding:14px 8px 0; font-size:.8rem; color:var(--muted)}
#status.warn{color:var(--red)}

main{padding:20px clamp(12px,2.6vw,30px) 70px; max-width:1260px; width:100%}
.head{display:flex; align-items:flex-end; gap:8px 12px; flex-wrap:wrap; margin-bottom:12px}
.head .sp{flex:1}
.meta{color:var(--muted); font-size:.85rem}
.tabs{display:flex; gap:4px; flex-wrap:wrap}
.tabs button,.btn{border:1px solid var(--line); background:transparent; padding:5px 12px; border-radius:3px; cursor:pointer; white-space:nowrap}
.tabs button[aria-pressed="true"],.btn.pri{background:var(--ink); color:var(--board); border-color:var(--ink)}
.btn.danger{color:var(--red); border-color:var(--rule)}
.btn:disabled{opacity:.5; cursor:default}
.link{all:unset; cursor:pointer; color:var(--accent); font-weight:500; overflow-wrap:anywhere}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--accent)}
.namecell{padding:6px 8px; display:flex; flex-direction:column; gap:3px; align-items:flex-start}
.chips{display:flex; flex-wrap:wrap; gap:3px 8px; font-size:.76rem; color:var(--muted)}
.chips .warn{color:var(--red); font-weight:500}

.hf{display:grid; gap:6px 16px; margin-bottom:12px}
.hf label{display:flex; align-items:baseline; gap:8px; color:var(--muted); font-size:.82rem; min-width:0}
.hf input,.hf select{flex:1; min-width:0; border:0; border-bottom:1px solid var(--line); background:transparent; padding:3px 2px; font-size:1rem; color:var(--ink); border-radius:0}
.hf input:focus,.hf select:focus{outline:0; border-bottom-color:var(--accent); background:var(--hit)}

.g{display:grid; gap:10px; margin-bottom:10px; align-items:stretch}
.st{display:grid; gap:10px; align-content:start; min-width:0}
.st > .box:last-child{align-self:stretch}
.box{background:var(--sheet); border:1px solid var(--line); border-radius:5px; min-width:0; overflow:hidden}
.box > .bt{display:flex; align-items:baseline; gap:10px; padding:7px 9px 5px; flex-wrap:wrap}
.box > .bt b{font-size:.84rem}
.box > .bt span{color:var(--muted); font-size:.76rem}
.box > .bt .r{margin-left:auto; display:flex; gap:10px; align-items:baseline}
.mini{all:unset; cursor:pointer; color:var(--accent); font-size:.78rem}
.mini:focus-visible{outline:2px solid var(--accent)}
.scroll{overflow-x:auto}

.in{display:block; width:100%; min-width:0; border:0; background:transparent; padding:6px 8px; border-radius:0; resize:none; overflow:hidden}
.in:focus{outline:0; background:var(--hit); box-shadow:inset 0 -2px 0 var(--accent)}
.in::placeholder{color:var(--muted); opacity:.55}
textarea.in{line-height:1.4; min-height:2.2em; overflow-wrap:anywhere}
select.in{padding:5px 4px}
input[type=date].in{padding:5px 4px; min-width:7.6rem}
input[type=checkbox]{width:15px; height:15px; margin:0; accent-color:var(--accent)}
.tr{display:grid; grid-template-columns:var(--cols); border-top:1px solid var(--rule)}
.tr > *{border-left:1px solid var(--rule); min-width:0}
.tr > *:first-child{border-left:0}
.tr.th{border-top:0}
.tr.th > *{border-left-color:transparent; color:var(--muted); font-size:.74rem; padding:0 8px 4px}
.tr.late .dshow{color:var(--red); font-weight:600; text-decoration:underline}
.ck{display:flex; align-items:center; justify-content:center}
.lab,.ro{color:var(--muted); font-size:.82rem; padding:6px 8px; display:flex; align-items:center}
.ro{color:var(--ink); font-size:inherit; overflow-wrap:anywhere}
.late-t{color:var(--red); font-weight:600}
.rc{display:flex; align-items:center; justify-content:center; gap:1px; border-left-color:transparent !important}
.rc button{all:unset; cursor:pointer; width:19px; height:22px; text-align:center; color:var(--muted); border-radius:3px; font-size:.9rem; opacity:.35}
.tr:hover .rc button,.tr:focus-within .rc button,.rc button:focus-visible{opacity:1}
.rc button:hover{background:var(--hit); color:var(--ink)}
.rc button:focus-visible{outline:2px solid var(--accent)}
@media (hover:none){.rc button{opacity:1}}
.wk .in{text-align:center; padding:6px 2px}
.wk .in:not(:placeholder-shown){background:var(--bar)}
.tr.th.wk > *{text-align:center; padding:0 0 4px}
.tr.wk > .in:first-child{text-align:left; padding:6px 8px; background:transparent}
.tr.th.wk > :first-child{text-align:left; padding:0 8px 4px}

.rt{display:flex; gap:4px; padding:0 8px 4px}
.rt button{border:1px solid var(--rule); background:transparent; border-radius:3px; min-width:28px; padding:1px 7px; cursor:pointer; font-size:.82rem}
.rich{min-height:var(--minh,160px); padding:8px 12px 12px; outline:0; line-height:1.45; overflow-wrap:anywhere; border-top:1px solid var(--rule)}
.rich:focus{background:var(--hit)}
.rich ul,.rich ol{margin:2px 0; padding-left:20px}
.rich p,.rich div{margin:0}

.tl{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-bottom:1px solid var(--line); margin-bottom:12px}
.tl > div{border-left:1px solid var(--line); padding:0 0 4px; min-width:0}
.tl .mo{display:flex; gap:6px; align-items:baseline; padding:0 8px 0 6px}
.tl .mo .mini{white-space:nowrap}
.tl .mo .mon{flex:1; min-width:0; color:var(--muted); font-size:.78rem; padding:1px 2px}
.tl .mo input{flex:1; min-width:0; border:0; background:transparent; color:var(--muted); font-size:.78rem; padding:1px 2px; border-radius:2px}
.tl .mo input:focus{outline:0; background:var(--hit); color:var(--ink)}
.tl .tr:first-child{border-top:0}
.tl ul{list-style:none; margin:0; padding:0 8px; font-size:.8rem}
.tl li{overflow-wrap:anywhere; padding:1px 0}
.tl li button{all:unset; cursor:pointer} .tl li button:hover{text-decoration:underline} .tl li button:focus-visible{outline:2px solid var(--accent)}
.tl .d{color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px}

.cap{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--sheet); border:2px solid var(--ink); border-radius:5px; padding:8px 10px; margin-bottom:12px}
.cap input[type=text]{flex:1 1 240px; min-width:0; border:0; background:transparent; font-size:1.05rem; padding:4px 2px}
.cap input[type=text]:focus{outline:0}
.cap select{border:1px solid var(--rule); background:transparent; border-radius:3px; padding:4px 6px; max-width:180px}
.empty{color:var(--muted); padding:8px 9px 10px; font-size:.88rem}
.list{list-style:none; margin:0; padding:0}
.list li{border-top:1px solid var(--rule); padding:7px 9px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.list .d{color:var(--muted); font-variant-numeric:tabular-nums; min-width:5.2rem}
.list .k{color:var(--muted); font-size:.82rem}
.list .sp{flex:1}
.file{position:absolute; width:1px; height:1px; opacity:0}

.ov{max-height:240px; overflow:auto}
.ebar{display:flex; gap:8px 12px; align-items:center; flex-wrap:wrap; background:var(--hit); border:1px solid var(--accent); border-radius:5px; padding:8px 10px; margin-bottom:12px; position:sticky; top:env(safe-area-inset-top,0px); z-index:3}
.ebar span{color:var(--muted); font-size:.85rem} .ebar .sp{flex:1}
.erow{border:1px dashed var(--line); border-radius:6px; padding:8px; margin-bottom:10px}
.erb{display:flex; gap:6px 14px; align-items:center; flex-wrap:wrap; margin-bottom:8px; font-size:.82rem; color:var(--muted)}
.erb b{color:var(--ink)} .erb .sp{flex:1}
.ein{border:1px solid var(--rule); background:var(--sheet); border-radius:3px; padding:3px 6px; min-width:0; font-size:.88rem}
.ein:focus{outline:2px solid var(--accent); outline-offset:0}
.eb{border:1px solid var(--rule); background:transparent; border-radius:3px; padding:2px 7px; cursor:pointer; font-size:.82rem; white-space:nowrap}
.eb:disabled{opacity:.35; cursor:default}
.eline{display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:4px 9px}
.eline label{display:flex; gap:6px; align-items:center; color:var(--muted); font-size:.8rem; flex:1 1 150px}
.eline .ein{flex:1 1 90px}
.eline select.ein{flex:0 1 auto}
.ecard .bt{align-items:center}
.ecard.hid{opacity:.55}
.enote{color:var(--muted); font-size:.8rem; padding:2px 9px; margin:0}
.eadd{color:var(--accent); align-self:start}
.files{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; padding:6px 9px 4px}
.fi{display:flex; flex-direction:column; gap:3px; min-width:0}
.fth{all:unset; cursor:zoom-in; display:block; border:1px solid var(--rule); border-radius:3px; overflow:hidden; aspect-ratio:4/3; background:var(--board)}
.fth:focus-visible{outline:2px solid var(--accent)}
.fth img{width:100%; height:100%; object-fit:cover; display:block}
.fdoc{display:flex; align-items:center; justify-content:center; aspect-ratio:4/3; border:1px solid var(--rule); border-radius:3px; color:var(--muted); font:600 1rem var(--head); text-decoration:none; background:var(--board)}
.fn{font-size:.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#lb{position:fixed; inset:0; background:rgba(10,18,26,.88); z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%; max-height:calc(100% - 60px); object-fit:contain; background:#fff}
textarea.in{field-sizing:content}
.inkwrap{border-top:1px solid var(--rule)}
.inkbar{display:none; flex-wrap:wrap; gap:3px; align-items:center; padding:3px 6px; border-bottom:1px solid var(--rule)}
html.ink-tools-on .inkbar{display:flex}
.inkbar button,.selbar button{border:1px solid var(--rule); background:transparent; border-radius:2px; padding:0 7px; cursor:pointer; font-size:.74rem; min-height:22px; line-height:1}
.inkbar button[aria-pressed="true"]{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.inkbar i{width:1px; height:14px; background:var(--rule); margin:0 2px}
.inkbar .dot{width:20px; min-height:20px; height:20px; padding:0; border-radius:50%; position:relative}
.inkbar .dot::after{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--ink)}
.inkbar .dot.c1::after{background:#1D5FA6} .inkbar .dot.c2::after{background:#C4302B}
.inkbar .dot[aria-pressed="true"]{background:transparent; outline:2px solid var(--ink); outline-offset:1px}
.inkbar{position:relative}
.inkmore{display:none; position:absolute; right:6px; top:100%; z-index:6; flex-direction:column; align-items:stretch; gap:4px; padding:6px; background:var(--sheet); border:1px solid var(--ink); border-radius:3px; box-shadow:0 8px 24px rgba(0,0,0,.16); min-width:170px}
html.ink-more-on .inkmore{display:flex}
.inkmore button,.inkmore select{text-align:left; min-height:26px}
.inkbar select{border:1px solid var(--rule); background:transparent; border-radius:2px; padding:0 3px; font-size:.74rem; min-height:22px}
.inkstage{position:relative}
.inkchips{position:absolute; top:4px; right:6px; z-index:1; display:flex; gap:4px}
.inkchip{border:1px solid var(--rule); background:var(--sheet); color:var(--muted); border-radius:2px; padding:0 7px; font-size:.72rem; min-height:20px; cursor:pointer; opacity:.9}
.inkchip:hover{color:var(--ink); border-color:var(--ink)}
html.ink-tools-on .inkchips{display:none}
.selbar{display:flex; gap:4px; align-items:center; padding:3px 6px; font-size:.76rem; border-bottom:1px solid var(--rule)}
.selbar[hidden]{display:none}
.selbar b{margin-right:4px}
canvas.ink{display:block; width:100%; touch-action:pan-y pinch-zoom; cursor:crosshair; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
html.pen canvas.ink, html.finger canvas.ink, html.inking canvas.ink{touch-action:none}
.inkwrap{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.rich.short{min-height:64px}
.rt button[aria-pressed="true"]{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
#inkfs{position:fixed; inset:0; z-index:15; background:var(--board); overflow:auto; display:none; padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch}
#inkfs.on{display:block}
.fsbar{display:flex; gap:12px; align-items:baseline; max-width:980px; margin:0 auto 8px}
.fsbar span{color:var(--muted); font-size:.85rem}
.fspage{max-width:980px; margin:0 auto; background:var(--sheet); border:1px solid var(--line); border-radius:5px; overflow:hidden}
.fspage .inkwrap{border-top:0}
.fspage .inkbar{position:sticky; top:0; background:var(--sheet); border-bottom:1px solid var(--rule); z-index:1}
.lk{display:flex; align-items:center; min-width:0}
.lk .in{flex:1}
.lk .open{flex:none; margin-right:6px; padding:2px 9px; border:1px solid var(--accent); border-radius:3px; color:var(--accent); text-decoration:none; font-size:.8rem; font-weight:500}
.lk .open:hover{background:var(--accent); color:var(--sheet)}
.acts{display:flex; gap:8px 12px; flex-wrap:wrap; align-items:flex-end}
.morebtn{display:none}
.stack textarea.in::placeholder{color:transparent}
@media (pointer:coarse){
  :root{--ctl:96px}
  .in,.hf input,.hf select,.ein,#rail input,.newsel,.cap input[type=text],.cap select,select[data-ui],.inkbar select{font-size:15px}   /* stops the phone zooming in on focus */
  input[type=checkbox]{width:20px; height:20px}
  .rc button{width:30px; height:32px; opacity:1}
  .mini{padding:5px 2px}
  .inkbar button,.selbar button,.inkchip{min-height:30px; padding:0 10px; font-size:.8rem}
  .inkbar .dot{width:28px; height:28px; min-height:28px; padding:0}
  .inkbar select{min-height:30px}
  .rt button{min-height:32px; min-width:36px}
}
#toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--board); padding:8px 14px; border-radius:4px; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .15s; max-width:90vw; z-index:9; display:flex; gap:14px; align-items:baseline}
#toast.on{opacity:1; pointer-events:auto}
#toast button{all:unset; cursor:pointer; text-decoration:underline; font-weight:600}
#toast button:focus-visible{outline:2px solid var(--board)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* ---- black and white, compact ---- */
body{font-size:.8125rem; grid-template-columns:200px minmax(0,1fr)}
h1{font:600 1.4rem/1.15 var(--body); letter-spacing:-.01em}
h2{font-family:var(--body)}
#rail{background:var(--rail); padding:10px 8px}
#rail .brand{font:600 .92rem var(--body); letter-spacing:.02em; padding:2px 8px 8px}
#rail button{padding:4px 8px; border-radius:2px}
#rail button:hover{background:var(--hit)}
#rail button[aria-current="page"],#rail button[aria-current="page"]:hover{background:var(--ink); color:var(--sheet)}
#rail .sec{padding:10px 8px 2px; font-size:.72rem; letter-spacing:.02em}
#rail input,.newsel{border:1px solid var(--line); background:var(--sheet); border-radius:2px; padding:4px 7px; margin:0 0 5px; min-width:0; font-size:.8125rem}
#status{font-size:.74rem}
main{padding:14px clamp(10px,2vw,24px) 48px; max-width:1340px}
.head{margin-bottom:8px; position:relative; gap:6px 10px}
.hf{margin-bottom:8px; gap:4px 14px}
.hf label{font-size:.76rem}
.hf input,.hf select{font-size:.9rem; padding:2px 2px}
.g{gap:8px; margin-bottom:8px}
.st{gap:8px}
.box{border-radius:3px}
.box > .bt{padding:5px 8px 4px; gap:8px}
.box > .bt b{font-size:.78rem; letter-spacing:.01em}
.box > .bt span{font-size:.72rem}
.in{padding:4px 7px}
textarea.in{min-height:1.95em}
.lab{padding:4px 7px; font-size:.76rem}
.ro{padding:4px 7px}
.namecell{padding:4px 7px}
.tr.th > *{font-size:.7rem; padding:0 7px 3px}
.btn,.tabs button{padding:3px 10px; border-radius:2px}
.btn.danger{color:var(--red)}
.tabs{gap:3px}
.mini{color:var(--ink); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:2px}
.mini:hover{text-decoration-color:var(--ink)}
.link{color:var(--ink); font-weight:600}
.link:hover{text-decoration:underline; text-underline-offset:2px}
.lk .open{border-color:var(--ink); color:var(--ink); border-radius:2px}
.lk .open:hover{background:var(--ink); color:var(--sheet)}
.cap{border-width:1px; border-radius:3px; padding:4px 8px; margin-bottom:8px}
.cap input[type=text]{font-size:.92rem; padding:3px 2px}
.cap select{border-radius:2px; padding:3px 5px}
.tl{margin-bottom:8px}
.chips{font-size:.72rem}
.empty{padding:6px 8px 8px; font-size:.8rem}
.list li{padding:5px 8px}
.mk.ok,.mk.watch,.mk.behind{color:var(--ink)}
.fold{all:unset; cursor:pointer; display:inline-flex; align-items:baseline; gap:5px}
.fold::before{content:"\25BE"; font-size:.7rem; color:var(--muted); width:.7em}
.fold[aria-expanded="false"]::before{content:"\25B8"}
.fold:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.box.folded > .bt{padding-bottom:5px}
.acts.menu{display:none; position:absolute; right:0; top:100%; z-index:7; flex-direction:column; align-items:stretch; gap:2px; background:var(--sheet); border:1px solid var(--ink); border-radius:3px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.16); min-width:210px}
.acts.menu.open{display:flex}
.acts.menu .btn{border-color:transparent; text-align:left; padding:6px 9px}
.acts.menu .btn:hover{background:var(--hit)}
.morebtn.menu{display:inline-block}
.in.num,.tr .num{text-align:right; font-variant-numeric:tabular-nums}
.tr.total{border-top:1px solid var(--line); font-weight:600}
.tr.total > div{padding:4px 7px}
.sh{all:unset; cursor:pointer}
.sh:hover{color:var(--ink); text-decoration:underline}

(function(){
"use strict";
/* ================= helpers ================= */
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var newId=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var get=function(o,p){return p.split('.').reduce(function(a,k){return a==null?undefined:a[k]},o)};
function setp(o,p,v){var ks=p.split('.');for(var i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}
var iso=function(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
var today=function(){return iso(new Date())};
var at=function(s){return new Date(s+'T12:00:00')};
var fmtD=function(s){return s?at(s).toLocaleDateString(undefined,{day:'numeric',month:'short'}):''};
var fmtS=function(s){if(!s)return '';var d=at(s);return d.toLocaleDateString(undefined,d.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'})};
var fmtL=function(s){return s?at(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):''};
var view=document.getElementById('view'), rail=document.getElementById('rail'), toastEl=document.getElementById('toast');
var toastT=0, undoFn=null;
function toast(m,undo){undoFn=undo||null;toastEl.innerHTML='<span>'+esc(m)+'</span>'+(undo?'<button data-act="undo">Undo</button>':'');
  toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');undoFn=null},undo?8000:3400)}

/* ================= reference data ================= */
var STATUS=[['','Not set'],['ok','On track'],['watch','Watch'],['behind','Behind']], MARK={ok:'\u25CF',watch:'\u25B2',behind:'\u25A0'};
var PHASES=['','Proposal','Concept','Prefeasibility','Feasibility','Detail engineering','Procurement','Construction','Commissioning','Closed'].map(function(p){return [p,p||'Not set']});
var BDST=[['','Lead'],['proposal','Proposal'],['submitted','Submitted'],['won','Won'],['lost','Lost']];
var IMPST=[['','Idea'],['doing','In progress'],['done','Done']];
var KICKOFF=["Read the contract scope, exclusions and client standards","Agree the design criteria and codes with the Project Manager and client","Build the deliverables register with hours and dates for every item","Confirm drawing numbering, revision and document control procedures","Name the lead, the checker and the approver for each discipline","List long-lead equipment and the vendor data each drawing depends on","Schedule design reviews, HAZOP and the model review dates","Hold a kickoff with engineers and drafters together, with a site visit or photos"];
var IFC=["Design criteria met and deviations approved in writing","Calculations checked and filed","Certified vendor data incorporated, or holds clearly marked","Interdisciplinary check complete and clashes resolved","HAZOP, safety in design and constructability actions closed","Drawings checked for dimensions, buildability, completeness and clarity","Signatures complete: designer, checker, discipline engineer, engineering manager, Project Manager","Client approval received and recorded"];
var OPTREF={BDST:BDST,IMPST:IMPST,OUTCOME:[['',''],['proceed','Proceed'],['actions','Proceed with actions'],['again','Review again']]};
function resolveOpts(o){if(o.optsRef)return OPTREF[o.optsRef]||[];if(o.choices)return [['','']].concat(o.choices.map(function(c){return [c,c]}));return typeof o.opts==='function'?o.opts():(o.opts||[])}
var asItems=function(a){return a.map(function(t){return {t:t}})};

/* ================= state and storage ================= */
var KINDS=['single','projects','people','records','snaps','days'];
var store={}, root=null, mode='loading', seen={};KINDS.forEach(function(k){store[k]={}});
var dirty={}, inflight={}, timers={}, fresh={}, gone={}, saving=0, dl=null, as=null;
var ui={agroup:(function(){try{return localStorage.getItem('lw.agroup')||'list'}catch(e){return 'list'}})(),wmode:(function(){try{return localStorage.getItem('lw.wmode')||'week'}catch(e){return 'week'}})(),railMore:(function(){try{return localStorage.getItem('lw.railmore')==='1'}catch(e){return false}})(),v:'dash',id:null,tab:'sheet',q:'',confirm:null,showDone:false,rtype:'',cap:'follow',capP:'',edit:null,pgname:'',pgscope:'page',fold:{},tv:{}};
try{ui.fold=JSON.parse(localStorage.getItem('lw.fold')||'{}')||{}}catch(e){}
try{var s0=JSON.parse(localStorage.getItem('lw.ui')||'null');if(s0&&s0.v){ui.v=s0.v;ui.id=s0.id;ui.tab=s0.tab||'sheet'}}catch(e){}
function remember(){try{localStorage.setItem('lw.ui',JSON.stringify({v:ui.v,id:ui.id,tab:ui.tab}))}catch(e){}}
var DEF={dash:function(){return {top3:[],tl:{},notes:'',follow:[],changes:[],rem:[]}},sched:function(){return {title:'',start:'',rows:[]}},
  bd:function(){return {pipeline:[],notes:''}},office:function(){return {items:[],improve:[],notes:''}},actions:function(){return {list:[]}},
  layouts:function(){return {L:{},pages:[]}},
  settings:function(){return {checklists:[{id:'kickoff',name:'Project kickoff',items:asItems(KICKOFF)},{id:'ifc',name:'Issue for construction',items:asItems(IFC)}]}}};
function single(id){if(!store.single[id])store.single[id]=(DEF[id]||function(){return {}})();return store.single[id]}
function templates(){var s=single('settings');if(!Array.isArray(s.checklists))s.checklists=[];return s.checklists}
function fromTemplate(t){return {name:t.name,items:(t.items||[]).filter(function(i){return i.t}).map(function(i){return {t:i.t,done:false,note:''}})}}
function newProject(name){return {name:name||'',isNew:true,client:'',phase:'',status:'',ts:Date.now(),dash:{},snap:{},team:{},risks:[],start:'',sched:[],changes:[],vendor:[],lessons:[],
  wiki:{snapshot:'',scope:'',glossary:'',links:[],ask:[],doc:{},flows:{},stds:{},meetings:[],contacts:[],tools:[]}}}
function newPerson(name){return {name:name||'',role:'',started:'',ts:Date.now(),dash:{},skills:'',develop:'',plan:[],reg:{},checkins:[],notes:''}}
function sorted(kind,arch){return Object.keys(store[kind]).map(function(id){return {id:id,d:store[kind][id]}}).filter(function(x){return !!x.d.archived===!!arch})
  .sort(function(a,b){return (a.d.order!=null?a.d.order:a.d.ts||0)-(b.d.order!=null?b.d.order:b.d.ts||0)})}
function saveError(e){var c=e&&e.code;
  toast(c==='too_big'?'That entry is too large to save (over 1 MB). Remove some handwriting or split it up.':c==='permission-denied'?"That change wasn't saved. Sign out and back in, then try again.":c==='quota_exceeded'||c==='resource-exhausted'?'Storage is full. Delete something, then try again.':c==='invalid_argument'?"That change wasn't saved. Your access to this page may be view-only.":"That change wasn't saved. Check your connection and try again.")}
function flush(kind,id){
  var key=kind+'/'+id;if(!root){dirty[key]=false;return Promise.resolve()}
  if(inflight[key]||!store[kind][id])return Promise.resolve();
  dirty[key]=false;inflight[key]=true;saving++;status();
  var body=clone(store[kind][id]);body.updated=today();store[kind][id].updated=body.updated;
  return root.collection(kind).doc(id).set(body).catch(saveError).then(function(){inflight[key]=false;saving--;status();if(dirty[key])return flush(kind,id)});
}
function save(kind,id,now){var key=kind+'/'+id;dirty[key]=true;rev++;clearTimeout(timers[key]);
  if(now)flush(kind,id);else timers[key]=setTimeout(function(){flush(kind,id)},600)}
function put(kind,id,doc){store[kind][id]=doc;fresh[kind+'/'+id]=Date.now();delete gone[kind+'/'+id];save(kind,id,true);return id}
function remove(kind,id){var key=kind+'/'+id;rev++;delete store[kind][id];gone[key]=true;clearTimeout(timers[key]);dirty[key]=false;
  if(root)root.collection(kind).doc(id).delete().catch(saveError)}
function stable(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var out={};Object.keys(v).sort().forEach(function(x){out[x]=v[x]});return out}return v})}
function intake(kind,snap){
  var changed=false,ids={};rev++;
  snap.docs.forEach(function(d){var key=kind+'/'+d.id;ids[d.id]=1;if(gone[key]||dirty[key]||inflight[key])return;
    var body=d.data();if(stable(body)!==stable(store[kind][d.id])){store[kind][d.id]=clone(body);changed=true}});
  Object.keys(store[kind]).forEach(function(id){var key=kind+'/'+id;
    if(!ids[id]&&!dirty[key]&&!inflight[key]&&!(fresh[key]&&Date.now()-fresh[key]<15000)&&kind!=='single'&&kind!=='days'){delete store[kind][id];changed=true}});
  Object.keys(gone).forEach(function(key){var p=key.split('/');if(p[0]===kind&&!ids[p[1]])delete gone[key]});
  return changed;
}
function moveChecks(){var tp=templates();Object.keys(store.projects).forEach(function(pid){var p=store.projects[pid];if(!p||!('checks' in p))return;
  (Array.isArray(p.checks)?p.checks:[]).forEach(function(k,ci){var items=(k&&k.items||[]).filter(function(i){return i&&i.t}),t=tp.filter(function(x){return x.name===k.name})[0];
    var untouched=items.every(function(i){return !i.done&&!i.note})&&t&&stable(items.map(function(i){return i.t}))===stable((t.items||[]).filter(function(i){return i.t}).map(function(i){return i.t}));
    if(untouched||!items.length)return;var rid='ck'+pid+'_'+ci;

    if(i>=0){hit++;var g=clone(go);if(g.v==='project'||g.v==='person')g.tab=path.indexOf('x.')===0?'c_'+path.split('.')[1]:path.indexOf('wiki')===0?'wiki':path.indexOf('checks')===0?'checks':'sheet';
      res.push({where:where,text:(i>30?'\u2026':'')+plain.slice(Math.max(0,i-30),i+q.length+50),go:g})}})}

    scan((kind==='projects'?'Project: ':'Person: ')+(d.name||'Untitled')+(d.archived?' (archived)':''),d,{v:kind==='projects'?'project':'person',id:id})})});
  Object.keys(store.records).forEach(function(id){scan(recLabel(store.records[id]),store.records[id],{v:'record',id:id})});
  [['dash','Dashboard','dash'],['bd','Business development','bd'],['office','Team','team'],['sched','Schedule and resourcing','sched'],['actions','Actions','actions']].forEach(function(x){if(store.single[x[0]])scan(x[1],store.single[x[0]],{v:x[2]})});
  Object.keys(store.days).forEach(function(id){var wkk=id.charAt(0)==='w';scan(wkk?'Week of '+fmtL(id.slice(1)):'Day, '+fmtL(id),store.days[id],wkk?{v:'week',id:id.slice(1)}:{v:'today',id:id})});
  if(store.single.inbox)scan('Inbox',store.single.inbox,{v:'inbox'});
  pages('page').forEach(function(p){if(store.single['pg_'+p.id])scan(p.name||'Page',store.single['pg_'+p.id],{v:'page',id:p.id})});
  return res.slice(0,60)}

function restoreFile(el){var file=el.files&&el.files[0];if(!file)return;var rd=new FileReader();
